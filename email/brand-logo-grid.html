<!--
  Brand logo grid, 3 x 3 — dark-mode hardened.

  WHY DARK MODE BREAKS LOGO GRIDS
  Clients fall into three groups:
    1. No dark mode of your email (Apple Mail default, most webmail):
       your bgcolor is used as-is.
    2. Respect your own dark styles (Apple Mail, iOS 13+, Outlook mac):
       the @media (prefers-color-scheme: dark) block below applies.
    3. FORCE their own inversion (Outlook.com, Outlook Windows/iOS/
       Android, Gmail app on some Android builds): they rewrite your
       background and text colours whatever you declare. bgcolor,
       background-color and !important are all ignored. There is no CSS
       that stops this.

  So for group 3 the only thing that survives is IMAGE PIXELS — no major
  client inverts the inside of an image. That is why each logo file must
  carry its own opaque light background (see the notes with this file);
  a transparent PNG of a black logo goes black-on-dark and disappears.

  The CSS below handles group 2 and softens group 3 where possible
  ([data-ogsc] is the attribute Outlook.com adds when it inverts).
-->
<style type="text/css">
  :root { color-scheme: light dark; supported-color-schemes: light dark; }

  /* Group 2: clients that let us define our own dark treatment.
     Keep the panel light so the logo files still sit on white. */
  @media (prefers-color-scheme: dark) {
    .logo-wrap { background-color: #ffffff !important; }
    .logo-cell { background-color: #ffffff !important; }
  }

  /* Group 3, partial: Outlook.com tags inverted elements with data-ogsc. */
  [data-ogsc] .logo-wrap, [data-ogsb] .logo-wrap { background-color: #ffffff !important; }
  [data-ogsc] .logo-cell, [data-ogsb] .logo-cell { background-color: #ffffff !important; }
</style>
