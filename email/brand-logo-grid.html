<!--
  Brand logo grid, 3 x 3 — Mike Sport.

  Every cell is a fixed 200px third of the 600px row (200 x 3 = 600) and
  every logo renders at the same 140px, so the grid is even no matter how
  different the source files are. line-height:0 / font-size:0 on the cells
  kills the stray baseline gap under images that made the rows look
  unequally spaced.

  Logos are expected to be square tiles with their light background baked
  into the file — that is what keeps them visible when a client forces
  dark mode (Gmail iOS cannot be opted out of).
-->
<style type="text/css">

  @media (prefers-color-scheme: dark) {
    .logo-wrap { background-color: #ffffff !important; }
    .logo-cell { background-color: #ffffff !important; }
  }

  [data-ogsc] .logo-wrap, [data-ogsb] .logo-wrap { background-color: #ffffff !important; }
  [data-ogsc] .logo-cell, [data-ogsb] .logo-cell { background-color: #ffffff !important; }
</style>
