<!--
  Four-column category row — Mike Sport fall 2026.
  Lifestyle Shoes / Running Shoes / Hiking Shoes / Accessories.

  Built as a "fluid hybrid": each column is an inline-block div capped at
  150px. Four fit across a 600px email; on a phone only two fit per line,
  so it becomes a 2 x 2 grid BY ITSELF — no media query needed. Several
  email builders strip the <style> block, which is why media-query
  stacking was not working.

  Outlook ignores inline-block, so the <!--[if mso]> ghost tables keep the
  four columns in a row there. Those comments are load-bearing.

  Column maths: 4 x 144px wrapper (132px image + 6px padding each side)
  = 576px, which leaves slack inside a 600px template so the fourth
  column cannot get bumped onto a second row by the template padding.
-->
