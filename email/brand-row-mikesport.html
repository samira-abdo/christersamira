<!--
  Three-column brand row, images only — Brooks / Saucony / Pacific Socks.

  Built as a "fluid hybrid": the columns are inline-block divs with a
  max-width, so they sit 3-across in a 600px email and drop to one per
  line on a phone ON THEIR OWN — no media query required. This matters
  because several email builders (and Gmail on some accounts) strip the
  <style> block entirely, which kills any media-query-based stacking.

  Outlook does not understand inline-block, so the <!--[if mso]> ghost
  tables below hold the three columns side by side there. Those comments
  are load-bearing: do not delete them.

  Column maths: 3 x 200px wrapper (186px image + 7px padding each side).
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;border-collapse:collapse;margin:0 auto;background-color:#ffffff;">
  <tr>
    <td align="center" style="padding:20px 0;text-align:center;font-size:0;line-height:0;">

      <!--[if mso]>
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center"><tr>
      <td width="200" align="center" valign="top">
      <![endif]-->

      <!-- BROOKS -->
      <div style="display:inline-block;width:100%;max-width:200px;vertical-align:top;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
          <tr>
            <td align="center" style="padding:7px;text-align:center;">
              <a href="https://lb.mikesport.com/pages/brooks" style="text-decoration:none;">
                <img src="https://cdn.shopify.com/s/files/1/2277/0487/files/Brooks_email_ad_1.png?v=1789628900" alt="Brooks" width="186"
                     style="display:block;width:100%;max-width:186px;height:auto;margin:0 auto;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;">
              </a>
            </td>
          </tr>
        </table>
      </div>

      <!--[if mso]></td><td width="200" align="center" valign="top"><![endif]-->

      <!-- SAUCONY -->
